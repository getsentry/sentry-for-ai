# Runs the getsentry/sentry-for-ai-evals suites against this PR's skills.
#
# Label a PR `ai-evals:<mark>` to run the tests with that pytest mark, e.g.
# `ai-evals:products`, on each target (a harness, Claude Code or Codex later, with a
# model) that repo's plan-evals action lists, or `ai-evals:<mark>:<models>` to run them
# on the targets whose `<harness>:<model>` contains `<models>`, e.g.
# `ai-evals:products:opus-5.5`. End either with `:x<count>` to run each test that many
# times, up to x10, e.g. `ai-evals:products:opus-5.5:x3`. Each label runs against
# skills built at both the PR's merge-base and head, using the same sentry-for-ai-evals
# commit, one job per test, repeat and target, so each test gets a clean container and
# they all run at once. The plan job creates one run per label and side on
# evals.sentry.dev, and each job sends its test's result into it, so one run holds every
# test and target. A new push reruns every eval label still on the PR.
#
# sentry-for-ai-evals is internal, so the jobs check it out with the readonly bot's
# token and use its actions from that path. Fork PRs get no secrets, so they're skipped.
# This repo is public, so the eval outputs (transcripts, reports, the agent's changes) are
# not kept as artifacts, and nothing passes between the jobs but the run's id. The
# products tests' results go to evals.sentry.dev, which is where to look at a run; the
# logs show only pytest's progress and failures.

name: AI Evals

on:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

jobs:
  plan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'labeled' && startsWith(github.event.label.name, 'ai-evals:')) ||
        (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'ai-evals:'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      evals-sha: ${{ steps.evals.outputs.commit }}
      base-sha: ${{ steps.base.outputs.sha }}
      eval-runs: ${{ steps.create.outputs.runs }}
      eval-jobs: ${{ steps.create.outputs.jobs }}
    steps:
      - name: Get sentry-for-ai-evals token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SENTRY_READONLY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_READONLYBOT_PRIVATE_KEY }}
          repositories: sentry-for-ai-evals
          permission-contents: read

      - id: evals
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: getsentry/sentry-for-ai-evals
          token: ${{ steps.token.outputs.token }}
          path: sentry-for-ai-evals
          persist-credentials: false

      - id: plan
        uses: ./sentry-for-ai-evals/.github/actions/plan-evals

      # The base side runs where the PR branched. The event's base SHA is the base branch's
      # tip, which can hold commits the head doesn't, and they'd count against the head.
      - id: base
        if: steps.plan.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Each side's run records its own skills commit, the merge-base or the head.
      - id: create
        if: steps.plan.outputs.count != '0'
        uses: ./sentry-for-ai-evals/.github/actions/create-runs
        with:
          runs: ${{ steps.plan.outputs.runs }}
          skills-sha: ${{ github.event.pull_request.head.sha }}
          base-skills-sha: ${{ steps.base.outputs.sha }}
          base-sha: ${{ steps.base.outputs.sha }}
          evals-api-key: ${{ secrets.SENTRY_EVALS_API_KEY }}

      # An older sentry-for-ai-evals lists no jobs per test, so the matrix below would be empty.
      - name: Check jobs support
        if: steps.plan.outputs.count != '0'
        shell: bash
        env:
          JOBS: ${{ steps.create.outputs.jobs }}
        run: |
          if [[ -z "$JOBS" ]]; then
            echo "::error::Merge the per-test jobs in sentry-for-ai-evals before running this workflow"
            exit 1
          fi

  eval:
    needs: plan
    # A label with no tests at either side has no jobs.
    if: needs.plan.outputs.count != '0' && needs.plan.outputs.eval-jobs != '[]'
    name: ${{ matrix.job.label }} (${{ matrix.job.revision }}, ${{ matrix.job.target.name }}, ${{ matrix.job.test-name }})
    # Per PR, label, revision, target and test, so the jobs don't cancel each other.
    concurrency:
      group: ai-evals-${{ github.event.pull_request.number }}-${{ matrix.job.label }}-${{ matrix.job.revision }}-${{ matrix.job.target.name }}-${{ matrix.job.test }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each test a label selects at each side, on each target the label picked.
        job: ${{ fromJSON(needs.plan.outputs.eval-jobs) }}
    steps:
      - name: Get sentry-for-ai-evals token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SENTRY_READONLY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_READONLYBOT_PRIVATE_KEY }}
          repositories: sentry-for-ai-evals
          permission-contents: read

      # Side by side, so the evals don't copy this repo into their image.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: getsentry/sentry-for-ai-evals
          ref: ${{ needs.plan.outputs.evals-sha }}
          token: ${{ steps.token.outputs.token }}
          path: sentry-for-ai-evals
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.job.revision == 'base' && needs.plan.outputs.base-sha || github.event.pull_request.head.sha }}
          path: sentry-for-ai
          persist-credentials: false

      # Sends this test's result into the run the plan job created for the label and
      # side. No artifact-name: this repo is public.
      - uses: ./sentry-for-ai-evals/.github/actions/run-evals
        with:
          marker: ${{ matrix.job.marker }}
          test: ${{ matrix.job.test }}
          harness: ${{ matrix.job.target.harness }}
          model: ${{ matrix.job.target.model }}
          revision: ${{ matrix.job.revision }}
          base-sha: ${{ needs.plan.outputs.base-sha }}
          sentry-for-ai-path: sentry-for-ai
          run-id: ${{ fromJSON(needs.plan.outputs.eval-runs)[format('{0}-{1}', matrix.job.label, matrix.job.revision)].id }}
          openrouter-api-key: ${{ secrets.AI_EVALS_OPENROUTER_API_KEY }}
          evals-api-key: ${{ secrets.SENTRY_EVALS_API_KEY }}
