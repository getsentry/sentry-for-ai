# Runs the getsentry/sentry-for-ai-evals suites against this PR's skills.
#
# Label a PR `ai-evals:<suite>` to run a suite, or `ai-evals:<suite>:<marker>` to run
# only its tests with that pytest marker, e.g. `ai-evals:sentry-get-started:products`.
# Each label runs against skills built at both the PR's merge-base and head, using the
# same eval harness commit, and on each target (an agent harness with a model) the eval
# repo's plan-evals action lists, one job per target. A report job per label and side
# uploads all the targets' results as one run. A new push reruns every eval label still
# on the PR.
#
# sentry-for-ai-evals is internal, so the jobs check it out with the readonly bot's
# token and use its actions from that path. Fork PRs get no secrets, so they're skipped.
# This repo is public, so the eval outputs (transcripts, reports, the agent's changes) are
# not kept as artifacts. The products tests' results go to evals.sentry.dev, which is
# where to look at a run; the logs show only pytest's progress and failures.

name: AI Evals

on:
  pull_request:
    types: [labeled, synchronize]

permissions: {}

jobs:
  plan:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'labeled' && startsWith(github.event.label.name, 'ai-evals:')) ||
        (github.event.action == 'synchronize' && contains(join(github.event.pull_request.labels.*.name, ','), 'ai-evals:'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
      count: ${{ steps.plan.outputs.count }}
      targets: ${{ steps.plan.outputs.targets }}
      target-count: ${{ steps.plan.outputs.target-count }}
      evals-sha: ${{ steps.evals.outputs.sha }}
      base-sha: ${{ steps.base.outputs.sha }}
    steps:
      - name: Get sentry-for-ai-evals token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SENTRY_READONLY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_READONLYBOT_PRIVATE_KEY }}
          repositories: sentry-for-ai-evals
          permission-contents: read

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: getsentry/sentry-for-ai-evals
          token: ${{ steps.token.outputs.token }}
          path: sentry-for-ai-evals
          persist-credentials: false

      - id: plan
        uses: ./sentry-for-ai-evals/.github/actions/plan-evals

      # An older harness has no target list or report action, so the matrix below would
      # have no targets and nothing would be uploaded.
      - name: Check target support
        if: steps.plan.outputs.count != '0'
        shell: bash
        env:
          TARGET_COUNT: ${{ steps.plan.outputs.target-count }}
        run: |
          if [[ -z "$TARGET_COUNT" || ! -f sentry-for-ai-evals/.github/actions/report-evals/action.yml ]]; then
            echo "::error::Merge the several-targets support in sentry-for-ai-evals before running this workflow"
            exit 1
          fi

      - id: evals
        if: steps.plan.outputs.count != '0'
        shell: bash
        run: echo "sha=$(git -C sentry-for-ai-evals rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The base side runs where the PR branched. The event's base SHA is the base branch's
      # tip, which can hold commits the head doesn't, and they'd count against the head.
      - id: base
        if: steps.plan.outputs.count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  eval:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: ${{ matrix.run.label }} (${{ matrix.revision }}, ${{ matrix.target.name }})
    # Per PR, label, revision and target, so the jobs don't cancel each other.
    concurrency:
      group: ai-evals-${{ github.event.pull_request.number }}-${{ matrix.run.label }}-${{ matrix.revision }}-${{ matrix.target.name }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
        revision: [base, head]
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - name: Get sentry-for-ai-evals token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SENTRY_READONLY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_READONLYBOT_PRIVATE_KEY }}
          repositories: sentry-for-ai-evals
          permission-contents: read

      # Side by side, so the evals don't copy this repo into their image.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: getsentry/sentry-for-ai-evals
          ref: ${{ needs.plan.outputs.evals-sha }}
          token: ${{ steps.token.outputs.token }}
          path: sentry-for-ai-evals
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ matrix.revision == 'base' && needs.plan.outputs.base-sha || github.event.pull_request.head.sha }}
          path: sentry-for-ai
          persist-credentials: false

      # No evals key here: the report job uploads every target's results as one run.
      - uses: ./sentry-for-ai-evals/.github/actions/run-evals
        with:
          suite: ${{ matrix.run.suite }}
          marker: ${{ matrix.run.marker }}
          agent: ${{ matrix.target.agent }}
          model: ${{ matrix.target.model }}
          revision: ${{ matrix.revision }}
          base-sha: ${{ needs.plan.outputs.base-sha }}
          sentry-for-ai-path: sentry-for-ai
          artifact-name: ai-evals-${{ matrix.run.suite }}-${{ matrix.run.marker || 'all' }}-${{ matrix.revision }}-${{ matrix.target.name }}
          openrouter-api-key: ${{ secrets.AI_EVALS_OPENROUTER_API_KEY }}

  report:
    needs: [plan, eval]
    # After every target's job, whether it passed, so a target's crash still fails here
    # with its name rather than quietly leaving it out of the run.
    if: ${{ always() && !cancelled() && needs.plan.outputs.count != '0' }}
    name: ${{ matrix.run.label }} (${{ matrix.revision }}) report
    concurrency:
      group: ai-evals-${{ github.event.pull_request.number }}-${{ matrix.run.label }}-${{ matrix.revision }}-report
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.plan.outputs.runs) }}
        revision: [base, head]
    steps:
      - name: Get sentry-for-ai-evals token
        id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.SENTRY_READONLY_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_READONLYBOT_PRIVATE_KEY }}
          repositories: sentry-for-ai-evals
          permission-contents: read

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: getsentry/sentry-for-ai-evals
          ref: ${{ needs.plan.outputs.evals-sha }}
          token: ${{ steps.token.outputs.token }}
          path: sentry-for-ai-evals
          persist-credentials: false

      # The skills sha is the tested side's own commit, as the eval jobs recorded it.
      - uses: ./sentry-for-ai-evals/.github/actions/report-evals
        with:
          artifact-pattern: ai-evals-${{ matrix.run.suite }}-${{ matrix.run.marker || 'all' }}-${{ matrix.revision }}-*
          expected-count: ${{ needs.plan.outputs.target-count }}
          suite: ${{ matrix.run.suite }}
          marker: ${{ matrix.run.marker }}
          skills-sha: ${{ matrix.revision == 'base' && needs.plan.outputs.base-sha || github.event.pull_request.head.sha }}
          revision: ${{ matrix.revision }}
          base-sha: ${{ needs.plan.outputs.base-sha }}
          artifact-name: ai-evals-upload-${{ matrix.run.suite }}-${{ matrix.run.marker || 'all' }}-${{ matrix.revision }}
          evals-api-key: ${{ secrets.SENTRY_EVALS_API_KEY }}
