name: Smoke Copilot plugin

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "src/plugins/copilot/**"
      - "src/plugins/agent-plugin/**"
      - "src/plugins/version.json"
      - "src/skills/**"
      - "src/references/**"
      - "scripts/build-common.sh"
      - "scripts/hydrate-references.py"
      - ".github/workflows/smoke-copilot.yml"
  pull_request:
    paths:
      - "src/plugins/copilot/**"
      - "src/plugins/agent-plugin/**"
      - "src/plugins/version.json"
      - "src/skills/**"
      - "src/references/**"
      - "scripts/build-common.sh"
      - "scripts/hydrate-references.py"
      - ".github/workflows/smoke-copilot.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install Copilot CLI
        run: npm install -g @github/copilot@1.0.97

      - name: Build and validate
        run: |
          src/plugins/copilot/build.sh "$RUNNER_TEMP/copilot-plugin"
          src/plugins/copilot/validate.sh "$RUNNER_TEMP/copilot-plugin"

      - name: Smoke test marketplace installation
        run: src/plugins/copilot/smoke.sh "$RUNNER_TEMP/copilot-plugin"
